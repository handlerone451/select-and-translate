<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Popup</title>
    <link rel="stylesheet" href="../styles/popup.css" />
  </head>
  <body>
    <main>
      <h3>Select and Translate</h3>
      
      <!-- API Keys Section -->
      <div class="api-keys-section">
        <div class="api-key-input">
          <label for="ocr-key">OCR.space API Key:</label>
          <div class="input-wrapper">
            <input type="password" id="ocr-key" placeholder="Enter OCR.space API key" />
            <button class="visibility-toggle" data-for="ocr-key">👁️</button>
          </div>
        </div>
        <div class="api-key-input">
          <label for="deepl-key">DeepL API Key:</label>
          <div class="input-wrapper">
            <input type="password" id="deepl-key" placeholder="Enter DeepL API key" />
            <button class="visibility-toggle" data-for="deepl-key">👁️</button>
          </div>
        </div>
      </div>

      <div class="language-selector">
        <label for="lang">Target language:</label>
        <select name="select" id="lang">
          <option value="BG">Bulgarian</option>
          <option value="CS">Czech</option>
          <option value="DA">Danish</option>
          <option value="DE">German</option>
          <option value="EL">Greek</option>
          <option value="EN-GB">English (British)</option>
          <option value="EN-US">English (American)</option>
          <option value="ES">Spanish</option>
          <option value="ET">Estonian</option>
          <option value="FI">Finnish</option>
          <option value="FR">French</option>
          <option value="HU">Hungarian</option>
          <option value="ID" selected>Indonesian</option>
          <option value="IT">Italian</option>
          <option value="JA">Japanese</option>
          <option value="KO">Korean</option>
          <option value="LT">Lithuanian</option>
          <option value="LV">Latvian</option>
          <option value="NB">Norwegian</option>
          <option value="NL">Dutch</option>
          <option value="PL">Polish</option>
          <option value="PT-BR">Portuguese (Brazilian)</option>
          <option value="PT-PT">Portuguese (European)</option>
          <option value="RO">Romanian</option>
          <option value="RU">Russian</option>
          <option value="SK">Slovak</option>
          <option value="SL">Slovenian</option>
          <option value="SV">Swedish</option>
          <option value="TR">Turkish</option>
          <option value="UK">Ukrainian</option>
          <option value="ZH">Chinese (simplified)</option>
        </select>
      </div>
      <div class="run-section">
        <button
          id="run-btn"
          class="run-button"
          title="Run Select and Translate"
        >
          <span class="play-icon"></span>
          <span>Translate</span>
        </button>
      </div>
      <div class="shortcut-section">
        <button id="shortcuts-btn" class="settings-button">
          Change Shortcut
        </button>
      </div>
      <div class="links-section">
        <a
          href="#"
          id="github-btn"
          class="link-button github-button"
          title="View on GitHub"
        >
          <svg
            class="github-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
          >
            <path
              fill="currentColor"
              d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33s1.71.11 2.5.33c1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"
            />
          </svg>
          GitHub
        </a>
        <a
          href="#"
          id="donate-btn"
          class="link-button donate-button"
          title="Support this project"
        >
          <svg
            class="donate-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
          >
            <path
              fill="currentColor"
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
            />
          </svg>
          Donate
        </a>
      </div>
    </main>
    <script type="module" defer src="../popup.ts"></script>
  </body>
</html>
